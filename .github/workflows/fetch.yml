name: fetch
# Push a file to requests/ -> every pending request is processed.
# A request may start with '# shards=N' (max 20) to split it over N parallel jobs.
on:
  push:
    branches: [main]
    paths: ['requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 tools/fetch.py matrix)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TDB: /tmp/tdbest
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils tesseract-ocr hunspell hunspell-he hunspell-en-us python3-pil
          pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - uses: actions/cache@v4
        with:
          path: /tmp/tdbest-cache
          key: tessdata-best-heb-eng-v1
      - name: Tessdata best (heb+eng)
        run: |
          mkdir -p /tmp/tdbest-cache $TDB
          for l in heb eng; do
            [ -s /tmp/tdbest-cache/$l.traineddata ] || curl -sSL -o /tmp/tdbest-cache/$l.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
            ln -sf /tmp/tdbest-cache/$l.traineddata $TDB/
          done
          ln -sfn /usr/share/tesseract-ocr/5/tessdata/configs $TDB/configs
      - name: Process requests
        run: python3 tools/fetch.py
      - name: Commit results
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A results docs
          git diff --cached --quiet && exit 0
          git commit -qm "fetch results shard $SHARD $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5 6; do git pull --rebase -q -X theirs && git push -q && break; sleep $((RANDOM % 20 + 5)); done

  index:
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild index
        run: |
          git pull -q
          python3 tools/fetch.py index
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add index.jsonl
          git diff --cached --quiet && exit 0
          git commit -qm "index $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
