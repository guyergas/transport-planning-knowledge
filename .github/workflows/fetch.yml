name: fetch
# Push a file to requests/ -> every pending request is processed.
# Request header lines: '# shards=N' (max 20) parallel jobs; '# force' re-process even unchanged files.
# Weekly schedule: re-checks every URL ever requested; only changed/new files are re-OCRed.
# Every run ends with the index job, which rebuilds ALL derived data from docs/ in one commit:
#   index.jsonl, sections.json(l), search.db (Release 'search-index') + search.json manifest.
on:
  push:
    branches: [main]
    paths: ['requests/**', 'inbox/**', 'removed.txt', 'sheet/**']
  schedule:
    - cron: '17 1 * * 0'   # Sunday 01:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Weekly request
        if: github.event_name == 'schedule'
        run: |
          python3 tools/fetch.py weekly
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add requests && git commit -qm "weekly re-check request" && git push -q
      - id: m
        run: echo "matrix=$(python3 tools/fetch.py matrix)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TDB: /tmp/tdbest
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils tesseract-ocr hunspell hunspell-he hunspell-en-us python3-pil
          pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - uses: actions/cache@v4
        with:
          path: /tmp/tdbest-cache
          key: tessdata-best-heb-eng-v1
      - name: Tessdata best (heb+eng)
        run: |
          mkdir -p /tmp/tdbest-cache $TDB
          for l in heb eng; do
            [ -s /tmp/tdbest-cache/$l.traineddata ] || curl -sSL -o /tmp/tdbest-cache/$l.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
            ln -sf /tmp/tdbest-cache/$l.traineddata $TDB/
          done
          ln -sfn /usr/share/tesseract-ocr/5/tessdata/configs $TDB/configs
      - name: Process requests
        run: python3 tools/fetch.py
      - name: Commit results
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A results docs inbox
          git diff --cached --quiet && exit 0
          git commit -qm "fetch results shard $SHARD $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5 6; do git pull --rebase -q -X theirs && git push -q && break; sleep $((RANDOM % 20 + 5)); done

  index:
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild derived data (index, sections, search)
        run: |
          git pull -q
          python3 tools/fetch.py index
          python3 tools/sections.py --all
          python3 tools/search_index.py build /tmp/search.db
      - name: Publish search.db + commit manifest
        run: |
          gh release view search-index -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create search-index -R "$GITHUB_REPOSITORY" -t search-index -n "SQLite FTS5 over docs/*/text.md. Manifest: search.json"
          gh release upload search-index /tmp/search.db --clobber -R "$GITHUB_REPOSITORY"
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A index.jsonl status.jsonl inaccessible.jsonl pending.md sections.jsonl search.json docs
          git diff --cached --quiet && exit 0
          git commit -qm "index + sections + search $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Report as Issue (weekly, or request with '# report')
        run: |
          for f in requests/*.txt; do
            n=$(basename "$f" .txt)
            case "$n" in weekly-*) ;; *) grep -q '^# *report' "$f" || continue ;; esac
            ls results/$n*.jsonl >/dev/null 2>&1 || continue
            git log --format=%s | grep -q "^report $n$" && continue
            mkdir -p reports && python3 tools/report.py "$n" > "reports/$n.md"
            url="https://github.com/$GITHUB_REPOSITORY/blob/main/reports/$n.md"
            { head -c 55000 "reports/$n.md"; printf '\n\n---\nFull report: %s\n' "$url"; } > /tmp/issue.md   # Issue body limit 65,536 chars
            git add "reports/$n.md" && git commit -qm "report $n" && git pull --rebase -q && git push -q
            gh issue create -R "$GITHUB_REPOSITORY" -t "Knowledge-map check: $n" -F /tmp/issue.md
          done
